imports:
    - { resource: config.yml }

parameters:
    wallabag.sentry_dsn: ''

#doctrine:
#    orm:
#        metadata_cache_driver: apc
#        result_cache_driver: apc
#        query_cache_driver: apc

monolog:
    handlers:
        main:
            type: fingers_crossed
            action_level: error
            handler: nested
        nested:
            type: stream
            path: "%kernel.logs_dir%/%kernel.environment%.log"
            level: "%env(WALLABAG_LOG_LEVEL)%"
        console:
            type: console

sentry:
    # Sentry's config node is scalar; the default processor advertises an
    # array-capable result type even when the configured fallback is a string.
    # Cast explicitly so Symfony's config validation accepts the empty default.
    dsn: "%env(string:default:wallabag.sentry_dsn:SENTRY_DSN)%"
