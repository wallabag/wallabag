name: "CS"

on:
  pull_request:
  push:
    branches:
      - master
      - "2.**"

permissions:
  contents: read

jobs:
  coding-standards:
    name: "CS Fixer, PHPStan & TwigCS"
    runs-on: ubuntu-latest
    env:
      APP_ENV: dev
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/wallabag?charset=utf8mb4

    steps:
      - name: "Checkout"
        id: checkout
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      - name: "Install PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # 2.40.0
        with:
          coverage: "none"
          php-version: "8.2"
          tools: pecl
          extensions: pdo, pdo_mysql, pdo_sqlite, pdo_pgsql, curl, imagick, pgsql, gd, tidy
          ini-values: "date.timezone=Europe/Paris"
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Install Node"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: 'yarn'

      - name: "Setup MySQL"
        run: |
          sudo systemctl start mysql.service
          sudo mysql -u root -proot -h 127.0.0.1 -e "CREATE DATABASE wallabag_test"

      - name: "Install dependencies with Composer"
        id: composer-install
        uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # 4.0.0
        with:
          composer-options: "--optimize-autoloader --prefer-dist"

      - name: "Install dependencies with Yarn"
        id: yarn-install
        run: yarn install --frozen-lockfile

      - name: "Run Composer validate"
        if: always() && steps.composer-install.outcome == 'success'
        run: "composer validate"

      - name: "Run Composer dependency analyser"
        if: always() && steps.composer-install.outcome == 'success'
        run: "bin/composer-dependency-analyser"

      - name: "Run PHP CS Fixer"
        if: always() && steps.composer-install.outcome == 'success'
        run: php bin/php-cs-fixer fix --verbose --dry-run

      - name: "Generate test cache for PHPStan"
        id: test-cache
        if: always() && steps.composer-install.outcome == 'success'
        run: "php bin/console cache:clear --env=test"

      - name: "Run PHPStan"
        if: always() && steps.test-cache.outcome == 'success'
        run: php bin/phpstan analyse --no-progress

      - name: "Run Twig CS Fixer"
        if: always() && steps.composer-install.outcome == 'success'
        run: php bin/twig-cs-fixer lint --no-cache --report=github

      - name: "Validate Twig syntax"
        if: always() && steps.composer-install.outcome == 'success'
        run: make lint-twig

      - name: "Validate repository YAML"
        if: always() && steps.composer-install.outcome == 'success'
        run: make lint-yaml

      - name: "Validate Symfony service containers"
        if: always() && steps.composer-install.outcome == 'success'
        run: make lint-container

      - name: "Run ergebnis/composer-normalize"
        if: always() && steps.composer-install.outcome == 'success'
        run: "composer normalize --dry-run --no-check-lock"

      - name: "Run Biome"
        if: always() && steps.yarn-install.outcome == 'success'
        run: make lint-js

      - name: "Run Stylelint"
        if: always() && steps.yarn-install.outcome == 'success'
        run: make lint-scss

      - name: "Validate Compose model"
        if: always() && steps.checkout.outcome == 'success'
        run: |
          docker compose version
          make lint-compose

      - name: "Install Actionlint"
        id: actionlint-install
        if: always() && steps.checkout.outcome == 'success'
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          bin_dir="$RUNNER_TEMP/wallabag-lint-bin"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check -
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir" actionlint
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"

      - name: "Validate GitHub Actions workflows"
        if: always() && steps.actionlint-install.outcome == 'success'
        run: |
          actionlint -version
          make lint-actions
